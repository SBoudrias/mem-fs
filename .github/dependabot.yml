version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=18']
    groups:
      vitest:
        patterns:
          - '@vitest/*'
          - 'vitest'
      linting:
        patterns:
          - '@typescript-eslint/*'
          - 'eslint-*'
          - 'eslint'
          - 'prettier'
          - 'typescript'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
