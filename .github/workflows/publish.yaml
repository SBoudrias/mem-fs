name: Release

# Secure release pipeline (npm Trusted Publishing + Staged Publishing).
# See CONTRIBUTING.md "Releasing" for the maintainer flow.
#
# Triggered by version tags created by `yarn lerna version`:
#   mem-fs@<version>        → publishes packages/mem-fs
#   mem-fs-editor@<version> → publishes packages/mem-fs-editor
#
# Security model:
#   - No npm token exists to steal; auth is GitHub OIDC → npm Trusted Publishing.
#   - The publish job only *stages* the release. A maintainer must approve it
#     with 2FA (`npm stage approve`) before it goes live.
#   - The publish job installs no dependencies and uses no cache, so nothing
#     that runs during build can publish the package.
#   - Only the publish job has `id-token: write`; every job uses
#     `persist-credentials: false` on checkout.
#   - `scripts/apply-publishconfig.mjs` rewrites the manifest (main/types/exports)
#     from `publishConfig` before staging, because npm (unlike lerna-lite) does
#     not apply publishConfig manifest overrides. See CONTRIBUTING.md.

on:
  push:
    tags:
      - 'mem-fs@*'
      - 'mem-fs-editor@*'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # no cache poisoning risk in a release workflow
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run tests
        run: yarn vitest run

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # no cache poisoning risk
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn tsc
      - name: Upload mem-fs build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-mem-fs
          path: packages/mem-fs/dist
          retention-days: 1
      - name: Upload mem-fs-editor build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-mem-fs-editor
          path: packages/mem-fs-editor/dist
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [test, build]
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve released package
        run: echo "PKG=${GITHUB_REF_NAME%@*}" >> "$GITHUB_ENV"
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ env.PKG }}
          path: packages/${{ env.PKG }}/dist
      - name: Normalize artifact layout
        run: |
          cd "packages/$PKG/dist"
          # Guard against a double-nested dist/ if the artifact preserved the prefix
          if [ -d dist ]; then
            mv dist/* .
            rmdir dist
          fi
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # bundles npm 11.17 (>= 11.15 required for stage publish)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Apply publishConfig overrides
        run: node scripts/apply-publishconfig.mjs "packages/$PKG/package.json"
      - name: Stage npm release
        run: |
          cd "packages/$PKG"
          npm stage publish --ignore-scripts
