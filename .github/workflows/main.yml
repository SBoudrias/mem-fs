name: Node.js CI
on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]

jobs:
  Linting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: SBoudrias/fast-setup-node@95d68654de46bf028db39ab4106675eb11017e98 # v1
        with:
          node-version: latest
      - run: yarn package lint --check
      - run: yarn oxfmt --check
      - run: yarn tsc
      - run: yarn oxlint

  Unit-Tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version:
          - 20
          - 22
          - 24
          - 26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: SBoudrias/fast-setup-node@95d68654de46bf028db39ab4106675eb11017e98 # v1
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn vitest run --coverage
